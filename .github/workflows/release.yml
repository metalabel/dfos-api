name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version lockstep
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

  # Re-run the correctness gate against the tagged commit: CI runs on branch
  # pushes and PRs, not on tag pushes, so nothing else has gated this exact
  # commit.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generated types match the committed snapshot
        run: |
          pnpm generate
          git diff --exit-code openapi.json src/generated

  release-npm:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # required for npm provenance (--provenance signs via the GitHub OIDC token)
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      # Auth is npm trusted publishing (OIDC): the package on npmjs.com is
      # configured to trust this repo + this workflow file, and npm exchanges
      # the job's OIDC token for publish access. No npm token exists anywhere.
      # Renaming this file breaks the trust binding — update the trusted
      # publisher config on npmjs.com if it ever moves.
      - name: Publish to npm
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "@metalabel/dfos-api@$ver" version >/dev/null 2>&1; then
            echo "@metalabel/dfos-api@$ver already on npm — skipping"
          else
            npm publish --provenance --access public
          fi

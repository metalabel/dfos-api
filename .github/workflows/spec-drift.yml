name: Spec drift

# Pull the live spec from api.dfos.com, regenerate types, and open (or update)
# a single PR when the wire truth has moved. The committed openapi.json is a
# snapshot, so this is how it stays honest.

on:
  schedule:
    # 09:15 UTC — off-peak, and offset off the hour so it is not queued behind
    # everybody else's midnight cron.
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh snapshot and regenerate types
        run: pnpm update-spec

      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet -- openapi.json src/generated; then
            echo "No drift — the committed snapshot matches the live spec."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat -- openapi.json src/generated
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      # A PR opened with GITHUB_TOKEN does not trigger CI (GitHub blocks
      # workflow recursion), so the gate has to run here or it runs nowhere.
      - name: Verify the regenerated types still build
        if: steps.drift.outputs.drifted == 'true'
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      # One fixed branch, force-pushed. A second day of drift updates the same
      # PR instead of stacking a new one.
      - name: Open or update the spec-update PR
        if: steps.drift.outputs.drifted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B spec-update
          git add openapi.json src/generated
          git commit -m "chore: refresh openapi.json snapshot from api.dfos.com"
          git push --force origin spec-update

          if [ -n "$(gh pr list --head spec-update --state open --json number --jq '.[].number')" ]; then
            echo "Existing spec-update PR refreshed."
          else
            gh pr create \
              --base main \
              --head spec-update \
              --title "chore: refresh openapi.json snapshot" \
              --body "The live spec at https://api.dfos.com/openapi.json has moved. This refreshes the committed snapshot and regenerates \`src/generated/api.ts\`. Review the type diff for anything a consumer would notice — removed fields and narrowed types are breaking, added ones are not. Note that CI does not run on this PR: GitHub blocks workflow recursion for PRs opened with \`GITHUB_TOKEN\`, so the typecheck, test, and build gate ran in the job that opened it instead."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
